name: Build & Verify Any Uninstaller

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Solution (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore source/AnyUninstaller.Avalonia/AnyUninstaller.Avalonia.csproj

      - name: Build Project (Release)
        run: dotnet build source/AnyUninstaller.Avalonia/AnyUninstaller.Avalonia.csproj -c Release --no-restore
